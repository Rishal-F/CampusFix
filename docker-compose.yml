
services:
  db:
    image: mysql:8.4
    container_name: campusfix-mysql
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: campusfix
      MYSQL_USER: campusfix_app
      MYSQL_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in your .env file}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?Set MYSQL_ROOT_PASSWORD in your .env file}
    ports:
      - "127.0.0.1:3306:3306"
    volumes:
      - campusfix_mysql_data:/var/lib/mysql
      - ./database/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "--password=$$MYSQL_ROOT_PASSWORD"]
      interval: 10s
      timeout: 5s
      retries: 10

volumes:
  campusfix_mysql_data:
